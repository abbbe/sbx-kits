schemaVersion: "2"
kind: mixin
name: sbx-jupyter
version: "0.3.1"
displayName: JupyterLab + MCP
description: JupyterLab with RTC, and jupyter-mcp-server over stdio in MCP_SERVER mode.
requires:
  agent: claude

# One secret per sandbox, shared by every kit in this repo. See the token
# bootstrap in setup.install below and README.md "One token".
args:
  token:
    default: ""
    description: >-
      Shared sandbox token. Empty means "generate one". Set it for every kit at
      once with --kit-arg token=<value>; the first kit to run creates the file
      and the rest reuse it.
  jupyter_mcp_pkg:
    default: jupyter-mcp-server
    description: >-
      What `uv pip install` is handed for the MCP server -- any requirement it
      accepts. The default is the PyPI release. To run a fork, pass a
      SHA-pinned VCS URL, e.g. --kit-arg
      sbx-jupyter.jupyter_mcp_pkg=git+https://github.com/<you>/jupyter-mcp-server@<sha>
      (namespaced: unlike token, only this kit declares it).
      A source outside PyPI and GitHub also needs its host in
      permissions.network.allow below, which --kit-arg cannot reach.

environment:
  variables:
    JUPYTER_VENV: /opt/jupyter
    JUPYTER_PORT: "8888"
    JUPYTER_RTC_STATE: /home/agent/.local/state/jupyter-rtc

# The complete outbound contract for this kit. Egress is default-deny, and an
# install hook that reaches an undeclared host fails `sbx create` with an error
# that names the package manager rather than the policy. `uv pip install` needs
# PyPI; apt is not used here, so the ubuntu archives are deliberately absent.
#
# github.com is listed for `jupyter_mcp_pkg` pointed at a fork, even though
# the default value never reaches it: permissions are static and read at create
# time, so the allowlist has to cover every value the arg can take, or
# --kit-arg alone would not be enough to switch. git-over-https is served by github.com itself, so
# unlike an archive download this needs no codeload.github.com.
permissions:
  network:
    allow:
      - pypi.org:443
      - files.pythonhosted.org:443
      - astral.sh:443
      - github.com:443

ports:
  - container: 8888
    protocol: tcp
    name: jupyterlab

setup:
  install:
    # THE SHARED TOKEN. Identical in all three kits and idempotent, so any
    # subset of them composes: whichever kit is first in --kit order creates the
    # file and the others take the `-s` branch. It is inline rather than a
    # shipped script precisely so each kit stands alone -- a shared file under
    # files/ would raise an overlay-ordering question that this does not have.
    #
    # Precedence: --kit-arg token=..., then -e SBX_TOKEN=..., then random.
    # The --kit-arg path is the guaranteed one; whether `-e` reaches install
    # hooks is unverified, so it is a convenience and not the contract.
    - user: "0"
      description: Shared sandbox token (creates it, or reuses an existing one)
      command: |
        set -e
        tok=/home/agent/.sbx-token
        if [ ! -s "$tok" ]; then
            preset='${{ kit.args.token }}'
            [ -n "$preset" ] || preset="${SBX_TOKEN:-}"
            [ -n "$preset" ] || preset="$(head -c 18 /dev/urandom | base64 | tr -d '/+=')"
            umask 077
            # Newline-terminated so `cat ~/.sbx-token` does not run into the
            # next prompt. Every consumer reads it through $(cat ...) or
            # $(cut ...), and command substitution strips trailing newlines,
            # so the value itself is unchanged.
            printf '%s\n' "$preset" > "$tok"
            chown agent:agent "$tok"
            chmod 600 "$tok"
        fi
    # jupyter-mcp-server hard-depends on jupyter-collaboration>=5, which pulls
    # jupyterlab>=4.6 — one install yields the whole stack. Do NOT add a
    # separate jupyterlab install. PEP 668 (Ubuntu 26.04) makes a bare
    # `pip install` fail; the venv is mandatory.
    #
    # A fork goes in through args.jupyter_mcp_pkg as git+https://...@<sha>.
    # Three things make that work and are worth not rediscovering: uv shells
    # out to a real git, which the base claude image provides at /usr/bin/git
    # (2.53.0 -- no kit here installs it, so it is the image's and not ours to
    # keep); https and not the SSH remote, because the container holds no key;
    # and a commit SHA and not a branch, since @main reinstalls whatever that
    # branch points at on rebuild day, which is not a pin at all. The build is
    # plain hatchling with the version read from a file, so nothing but the
    # sources is needed.
    #
    # The wheel ships etc/jupyter/jupyter_server_config.d/jupyter_mcp_server.json,
    # which auto-enables the MCP *server extension* inside Jupyter — the unsafe
    # JUPYTER_SERVER topology (writes .ipynb behind RTC's back when no browser
    # tab is open). There is no upstream opt-out, so overwrite that file with an
    # explicit disable: this covers even a manually launched `jupyter lab`,
    # not just the supervised one (which also passes the disable flag).
    - user: "0"
      description: JupyterLab + MCP server in one venv; hard-disable the MCP server extension
      command: |
        set -e
        uv venv /opt/jupyter
        VIRTUAL_ENV=/opt/jupyter uv pip install --no-cache '${{ kit.args.jupyter_mcp_pkg }}'
        install -d /opt/jupyter/etc/jupyter/jupyter_server_config.d
        printf '%s\n' '{"ServerApp": {"jpserver_extensions": {"jupyter_mcp_server": false}}}' \
          > /opt/jupyter/etc/jupyter/jupyter_server_config.d/jupyter_mcp_server.json
        chmod -R a+rX /opt/jupyter
    # RTC state lives in the container overlay (NOT a volume, NOT the bind
    # mount): ystore and session store then survive stop/start together and
    # die with `sbx rm` together. Splitting their lifetimes is what corrupts
    # notebooks (see README).
    #
    # chmod +x is load-bearing, not hygiene: files/ entries arrive 0644
    # regardless of their mode on disk, and an unexecutable startup command
    # fails with Permission denied and looks like a broken kit.
    - user: "0"
      description: RTC state dir and script permissions
      command: |
        set -e
        install -d -o agent -g agent -m 0755 /home/agent/.local /home/agent/.local/state
        install -d -o agent -g agent -m 0700 /home/agent/.local/state/jupyter-rtc
        chown -R agent:agent /home/agent/bin
        chmod +x /home/agent/bin/jupyter-svc.sh /home/agent/bin/jupyter-mcp.sh
    # Install commands run synchronously at create, BEFORE the CLI attaches
    # and launches the interactive claude session — registering here is
    # race-free. Startup commands are fired by a detached dispatcher that
    # races the session; never register MCP there.
    #
    # --scope user: visible from every cwd, independent of the workspace.
    # `claude mcp add` is not idempotent (exits 1 on an existing name), hence
    # `|| true` — matches the built-in claude kit's own gateway registration.
    # JUPYTER_URL/JUPYTER_TOKEN are deliberately NOT baked in with -e: the
    # wrapper reads the token file at spawn time, so it can never go stale.
    - user: "agent"
      description: Register the stdio MCP server with Claude (install-time, race-free)
      command: |
        set -e
        export PATH="$HOME/.local/bin:$HOME/.claude/local:$PATH"
        claude mcp add jupyter --scope user -- /home/agent/bin/jupyter-mcp.sh || true

  startup:
    # A single background command is not supervised — the script itself is a
    # restart loop with backoff.
    - user: "1000"
      background: true
      description: JupyterLab, supervised
      command: ["/home/agent/bin/jupyter-svc.sh"]

# For a mixin the base agent's CLAUDE.md gains a "## Kits" section pointing at
# this content (progressive disclosure); `filename` is only used by sandbox
# kits and is deliberately absent here.
agentInstructions:
  content: |
    ## JupyterLab in this sandbox

    JupyterLab runs on port 8888 with real-time collaboration (RTC) on.
    Work with notebooks through the `jupyter` MCP server, never by editing
    .ipynb files directly: a direct file write goes behind RTC's back and is
    later pulled into any open browser tab wholesale, discarding unsaved
    edits made there.

    The notebook root is the mounted workspace. The access token is the
    sandbox-wide one in ~/.sbx-token if you need to construct a URL for the UI.
